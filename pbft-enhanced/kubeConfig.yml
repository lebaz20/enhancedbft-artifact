apiVersion: v1
kind: Pod
metadata:
  name: p2p-server-0
  labels:
    app: p2p-server
    domain: blockchain
    pod-index: '0'
spec:
  containers:
    - name: p2p-server
      image: lebaz20/blockchain-p2p-server:latest
      imagePullPolicy: Never
      resources:
        limits:
          memory: 384Mi
          cpu: 90m
      env:
        - name: SECRET
          value: NODE0
        - name: IS_FAULTY
          value: 'false'
        - name: SHOULD_REDIRECT_FROM_FAULTY_NODES
          value: 'false'
        - name: P2P_PORT
          value: '5001'
        - name: HTTP_PORT
          value: '3001'
        - name: TRANSACTION_THRESHOLD
          value: '20'
        - name: NUMBER_OF_NODES_PER_SHARD
          value: '32'
        - name: NUMBER_OF_NODES
          value: '96'
        - name: NODES_SUBSET
          value: >-
            [48,87,56,63,73,24,88,26,0,6,80,53,23,76,66,31,57,12,18,25,93,21,17,43,30,91,14,84,58,46,74,3]
        - name: SUBSET_INDEX
          value: SUBSET3
        - name: VERIFICATION_SOURCE_SUBSETS
          value: '["SUBSET1"]'
        - name: CORE
          value: ws://core-server:4999
        - name: CPU_LIMIT
          value: '0.09'
        - name: DEFAULT_TTL
          value: '6'
        - name: NODE_OPTIONS
          value: ''
        - name: STRICT_BLOCK_THRESHOLD
          value: '0'
      ports:
        - containerPort: 3001
        - containerPort: 5001
      readinessProbe:
        httpGet:
          path: /health
          port: 3001
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
  restartPolicy: OnFailure
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-server-0
  labels:
    app: p2p-server
    domain: blockchain
spec:
  clusterIP: None
  selector:
    app: p2p-server
    pod-index: '0'
  ports:
    - name: '5001'
      protocol: TCP
      port: 5001
      targetPort: 5001
    - name: '3001'
      protocol: TCP
      port: 3001
      targetPort: 3001
---
